<!DOCTYPE html>
<html>
    <head>
        <title>Rock Paper Scissors</title>
        <link rel="stylesheet" href="css/styles.css">
    </head>
    <body>
        <h1>Rock Paper Scissors</h1>
        <h3>Pick your choice:</h3>
        <image src="img/rock.png" alt="Rock" width="120" height="120">
        <image src="img/paper.png" alt="Paper" width="120" height="120">
        <image src="img/scissors.png" alt="Scissors" width="120" height="120">
        <p>
            <button id="rock-button" onclick="shoot(0)">ROCK</button>
            <button id="paper-button" onclick="shoot(1)">PAPER</button>
            <button id="scissors-button" onclick="shoot(2)">SCISSORS</button>
        </p>
        <p id="choiceText"><br></p>
        <p id="resultText"><br></p>
        <h2 id="scoreboard">Wins: 0 Losses: 0</h2>
    </body>
    <script>
        const choiceArray = ["rock", "paper", "scissors"];
        let win = 0;
        let lose = 0;
        function shoot(choice) {
            let compChoice = Math.floor(Math.random() * 3);
            document.getElementById("choiceText").innerHTML = `You picked ${choiceArray[choice]} and the computer picked ${choiceArray[compChoice]}.`;
            if (choice > compChoice || choice == 0 && compChoice == 2){
                document.getElementById("resultText").innerHTML = "You won!";
                win++;
                document.getElementById("resultText").style.color = "green";
            } else if (choice == compChoice) {
                document.getElementById("resultText").innerHTML = "There was a tie.";
                document.getElementById("resultText").style.color = "black";
            } else {
                document.getElementById("resultText").innerHTML = "You lost.";
                lose++;
                document.getElementById("resultText").style.color = "red";
            }
            document.getElementById("scoreboard").innerHTML = `Wins: ${win} Losses: ${lose}`;
        }
    </script>
</html>
